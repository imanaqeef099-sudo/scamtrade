<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Luno Clone — Portfolio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>

    <div class="sidebar" id="sidebar">
        <div class="profile-header">
            <p>ACCOUNT</p>
            <h2 id="uname-sidebar">Pelabur</h2>
        </div>
        <div class="menu-section">
            <a href="verify.html" class="menu-item">
                <div class="menu-item-left"><span class="menu-icon">👤</span> Akaun & Tetapan</div>
                <span class="arrow">›</span>
            </a>
        </div>
        <div class="menu-section">
            <div class="menu-title">Bayar</div>
            <a href="transfer.html" class="menu-item">
                <div class="menu-item-left"><span class="menu-icon">↗️</span> Hantar kripto</div>
                <span class="arrow">›</span>
            </a>
        </div>
    </div>

    <div class="top-nav">
        <div class="avatar" onclick="toggleSidebar()" id="avatar-initial">P</div>
        <div class="bell">🔔</div>
    </div>

    <div class="content">
        <div class="balance-card">
            <div class="balance-label">Jumlah Portfolio (RM)</div>
            <div class="balance-amount" id="balance">RM 0.00</div>
            <div class="action-buttons">
                <button class="btn-primary" onclick="window.location.href='deposit.html'">Deposit</button>
                <button class="btn-secondary" onclick="window.location.href='withdraw.html'">Withdraw</button>
            </div>
        </div>

        <h2 class="section-title">Market</h2>
        
        <div class="coin-list-card">
            <div class="coin-row">
                <div class="coin-left">
                    <div class="coin-icon" style="background: #f7931a;">₿</div>
                    <div class="coin-names">
                        <h3>Bitcoin</h3>
                        <p>BTC</p>
                    </div>
                </div>
                <div class="coin-right">
                    <div class="coin-price">RM <span id="btc-price">279,678.00</span></div>
                    <div class="coin-change down" id="btc-change">-3.27%</div>
                </div>
            </div>
            <!-- Butang Trade -->
            <div style="display: flex; gap: 10px; margin-top: 15px;">
                <button class="btn-buy" onclick="buyBTC()" style="flex: 1;">Buy BTC</button>
                <button class="btn-sell" onclick="sellBTC()" style="flex: 1;">Sell BTC</button>
            </div>
            <div style="margin-top: 10px; font-size: 12px; color: var(--text-muted); text-align: center;">
                Aset BTC anda: <b id="btc-asset">0.000000</b> BTC
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="dashboard.html" class="nav-item active"><span class="nav-icon">🏠</span> Utama</a>
        <a href="#" class="nav-item"><span class="nav-icon">🧭</span> Teroka</a>
    </div>

    <script>
        let name = localStorage.getItem('investor_name') || 'Pelabur';
        document.getElementById('uname-sidebar').textContent = name;
        document.getElementById('avatar-initial').textContent = name.charAt(0).toUpperCase();

        // Setup Baki RM & Aset BTC
        let balance = parseFloat(localStorage.getItem('fake_balance') || '0');
        let btcAsset = parseFloat(localStorage.getItem('btc_asset') || '0');
        let btcPrice = 279678.00; // Harga fake

        function updateUI() {
            // Duit RM
            document.getElementById('balance').textContent = `RM ${balance.toFixed(2)}`;
            localStorage.setItem('fake_balance', balance);
            
            // Aset BTC
            document.getElementById('btc-asset').textContent = btcAsset.toFixed(6);
            localStorage.setItem('btc_asset', btcAsset);

            // Auto naik sikit harga BTC
            btcPrice += (Math.random() - 0.4) * 50; 
            document.getElementById('btc-price').textContent = btcPrice.toLocaleString('en-MY', {minimumFractionDigits: 2});
        }

        function toggleSidebar() {
            document.getElementById('sidebar').classList.toggle('open');
            document.getElementById('overlay').classList.toggle('open');
        }

        // Fungsi Beli BTC
        function buyBTC() {
            if (balance < 100) {
                alert("Baki tidak mencukupi. Minimum beli RM100.");
                return;
            }
            let buyAmount = 100; // Beli RM100
            balance -= buyAmount;
            let btcBought = buyAmount / btcPrice;
            btcAsset += btcBought;
            
            alert(`Berjaya beli ${btcBought.toFixed(6)} BTC dengan harga RM100.`);
            updateUI();
        }

        // Fungsi Jual BTC
        function sellBTC() {
            if (btcAsset <= 0) {
                alert("Anda tiada aset BTC untuk dijual.");
                return;
            }
            let sellAmount = btcAsset * btcPrice;
            balance += sellAmount;
            btcAsset = 0;
            
            alert(`Berjaya jual aset dengan nilai RM${sellAmount.toFixed(2)}.`);
            updateUI();
        }

        // Update UI mula-mula
        updateUI();

        // Harga auto naik setiap 3 saat
        setInterval(updateUI, 3000);
    </script>
</body>
</html>
