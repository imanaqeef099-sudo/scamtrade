<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AuraVest — Portfolio</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    
    <div class="card">
        <p class="subtitle" style="margin-bottom: 8px;">Selamat kembali, <b id="uname" style="color: white;">Pelabur</b></p>
        
        <div class="balance-box">
            <div class="balance-label">Jumlah Nilai Portfolio</div>
            <div class="balance-amount" id="balance">RM 0.00</div>
            <div class="balance-change" id="profit" style="color: #94a3b8;">Sila buat deposit untuk mula</div>
        </div>

        <div class="chart-container">
            <svg class="chart-svg" id="chart" viewBox="0 0 400 160" preserveAspectRatio="none">
                <defs>
                    <linearGradient id="gradient" x1="0" x2="0" y1="0" y2="1">
                        <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
                        <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
                    </linearGradient>
                </defs>
                <path id="chart-fill" d="" fill="url(#gradient)" />
                <path id="chart-line" class="chart-line" d="" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>

        <div style="display: flex; gap: 12px;">
            <button class="btn-deposit" onclick="window.location.href='deposit.html'">Deposit</button>
            <button class="btn-withdraw" onclick="window.location.href='withdraw.html'">Withdraw</button>
        </div>

        <div class="market-list">
            <div class="market-title">Market <span>Lihat Semua</span></div>
            
            <div class="coin-row">
                <div class="coin-info">
                    <div class="coin-icon" style="background: rgba(247, 147, 26, 0.1); color: #f7931a;">₿</div>
                    <div>
                        <div class="coin-name">Bitcoin</div>
                        <div class="coin-ticker">BTC</div>
                    </div>
                </div>
                <div class="coin-price">
                    <div class="coin-val">RM 245,120</div>
                    <div class="coin-change">+3.2%</div>
                </div>
            </div>

            <div class="coin-row">
                <div class="coin-info">
                    <div class="coin-icon" style="background: rgba(98, 126, 234, 0.1); color: #627eea;">Ξ</div>
                    <div>
                        <div class="coin-name">Ethereum</div>
                        <div class="coin-ticker">ETH</div>
                    </div>
                </div>
                <div class="coin-price">
                    <div class="coin-val">RM 12,450</div>
                    <div class="coin-change">+1.8%</div>
                </div>
            </div>

            <div class="coin-row">
                <div class="coin-info">
                    <div class="coin-icon" style="background: rgba(250, 204, 21, 0.1); color: #facc15;">Au</div>
                    <div>
                        <div class="coin-name">Gold</div>
                        <div class="coin-ticker">XAU/USD</div>
                    </div>
                </div>
                <div class="coin-price">
                    <div class="coin-val">RM 8,320</div>
                    <div class="coin-change down">-0.4%</div>
                </div>
            </div>
        </div>
    </div>

    <div class="bottom-nav">
        <a href="dashboard.html" class="nav-item active"><span class="nav-icon">🏠</span> Home</a>
        <a href="#" class="nav-item"><span class="nav-icon">📈</span> Market</a>
        <a href="deposit.html" class="nav-item"><span class="nav-icon">💳</span> Deposit</a>
        <a href="#" class="nav-item"><span class="nav-icon">👤</span> Account</a>
    </div>

    <script>
        document.getElementById('uname').textContent = localStorage.getItem('investor_name') || 'Pelabur';
        let balance = parseFloat(localStorage.getItem('fake_balance') || '0');
        let points = Array(20).fill(0);
        
        document.getElementById('balance').textContent = `RM ${balance.toFixed(2)}`;

        function updateDashboard() {
            document.getElementById('balance').textContent = `RM ${balance.toFixed(2)}`;
            
            if (balance > 0) {
                let profit = balance - 100;
                let pct = (profit / 100) * 100;
                document.getElementById('profit').textContent = `+ RM ${profit.toFixed(2)} (${pct.toFixed(2)}%) Hari Ini`;
                document.getElementById('profit').style.color = "#10b981";
            }

            points.push(balance);
            if(points.length > 20) points.shift();
            
            let d = "", fillD = `M 0,160 `;
            let minVal = Math.min(...points) - 5, maxVal = Math.max(...points) + 5;
            let range = maxVal - minVal || 1;

            points.forEach((p, i) => {
                let x = (i / 19) * 400;
                let y = 160 - ((p - minVal) / range) * 160;
                if(y < 0) y = 0;
                d += (i === 0 ? "M" : "L") + ` ${x},${y} `;
                fillD += `L ${x},${y} `;
            });
            fillD += `L 400,160 Z`;

            document.getElementById('chart-line').setAttribute('d', d);
            document.getElementById('chart-fill').setAttribute('d', fillD);
        }
        updateDashboard();

        setInterval(() => {
            if (balance > 0) {
                balance += (Math.random() * 0.80);
                localStorage.setItem('fake_balance', balance);
                updateDashboard();
            }
        }, 2000);
    </script>
</body>
</html>
