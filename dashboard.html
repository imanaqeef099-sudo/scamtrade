<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Saya</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="card">
        <p class="subtitle" style="margin-bottom: 8px;">Selamat kembali, <b id="uname" style="color: white;">Pelabur</b></p>
        
        <div class="balance-box">
            <div class="balance-label">Jumlah Nilai Portfolio</div>
            <div class="balance-amount" id="balance">RM 100.00</div>
            <div class="balance-change" id="profit">+ RM 0.00 (0.0%) Hari Ini</div>
        </div>

        <div class="chart-container">
            <svg class="chart-svg" id="chart" viewBox="0 0 400 140" preserveAspectRatio="none">
                <defs>
                    <linearGradient id="gradient" x1="0" x2="0" y1="0" y2="1">
                        <stop offset="0%" stop-color="#10b981" stop-opacity="0.3"/>
                        <stop offset="100%" stop-color="#10b981" stop-opacity="0"/>
                    </linearGradient>
                </defs>
                <path id="chart-fill" d="" fill="url(#gradient)" />
                <path id="chart-line" d="" fill="none" stroke="#10b981" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
        </div>

        <button onclick="window.location.href='withdraw.html'">Pengeluaran Dana</button>
    </div>

    <script>
        document.getElementById('uname').textContent = localStorage.getItem('investor_name') || 'Pelabur';
        let balance = 100.00;
        let points = Array(20).fill(100);
        
        setInterval(() => {
            balance += (Math.random() * 1.5);
            document.getElementById('balance').textContent = `RM ${balance.toFixed(2)}`;
            
            let profit = balance - 100;
            let pct = (profit / 100) * 100;
            document.getElementById('profit').textContent = `+ RM ${profit.toFixed(2)} (${pct.toFixed(2)}%) Hari Ini`;

            points.push(balance);
            if(points.length > 20) points.shift();
            
            let d = "";
            let fillD = `M 0,140 `;
            let minVal = Math.min(...points) - 2;
            let maxVal = Math.max(...points) + 2;
            let range = maxVal - minVal;

            points.forEach((p, i) => {
                let x = (i / 19) * 400;
                let y = 140 - ((p - minVal) / range) * 140;
                if(y < 0) y = 0;
                d += (i === 0 ? "M" : "L") + ` ${x},${y} `;
                fillD += `L ${x},${y} `;
            });
            fillD += `L 400,140 Z`;

            document.getElementById('chart-line').setAttribute('d', d);
            document.getElementById('chart-fill').setAttribute('d', fillD);
        }, 1500);
    </script>
</body>
</html>
